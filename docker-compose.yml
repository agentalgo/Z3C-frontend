services:
  frontend:
    image: ${FRONTEND_IMAGE_NAME}:${FRONTEND_IMAGE_TAG}
    container_name: ${FRONTEND_CONTAINER_NAME}
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_BASE_URL: ${VITE_BASE_URL}
    ports:
      - "${FRONTEND_PORT}:80"
    environment:
      CSP_CONNECT_SRC: ${CSP_CONNECT_SRC:-http://10.192.100.50:5000}
      # Restrict envsubst to this var so nginx $uri/$host stay intact.
      NGINX_ENVSUBST_FILTER: CSP_CONNECT_SRC
    restart: unless-stopped
